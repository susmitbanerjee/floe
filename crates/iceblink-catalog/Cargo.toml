[package]
name = "iceblink-catalog"
description = "Talks to Iceberg REST catalogs for Iceblink, read-only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
# rt-tokio and sso only: no credentials-process (AGENTS.md forbids shelling out), and no
# default-https-client (that pulls in aws-lc).
aws-config = { workspace = true, features = ["rt-tokio", "sso"] }
aws-credential-types.workspace = true
aws-sigv4 = { workspace = true, features = ["sign-http", "http1"] }
aws-smithy-http-client = { workspace = true, features = ["rustls-ring", "rt-tokio"] }
aws-smithy-runtime-api.workspace = true
iceberg.workspace = true
iceberg-catalog-rest.workspace = true
percent-encoding = { workspace = true, features = ["std"] }
# rustls-tls: rustls with ring and the compiled-in webpki roots, so no certificate files are read.
reqwest = { workspace = true, features = ["rustls-tls"] }
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true, features = ["std"] }
typetag.workspace = true
url = { workspace = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std", "tracing-log"] }
wiremock.workspace = true

[lints]
workspace = true
